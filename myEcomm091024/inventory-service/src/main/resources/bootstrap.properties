spring.application.name=inventory-service
spring.config.import=optional:consul:
server.port=${SERVICE_PORT:0}
management.endpoints.web.exposure.include=*

spring.cloud.consul.config.enabled=true
spring.cloud.consul.config.name=inventory-service
spring.cloud.consul.config.watch.enabled=false
spring.cloud.consul.config.format=properties

spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.cloud.loadbalancer.ribbon.enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:7080/realms/microservices-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:7080/realms/microservices-realm/protocol/openid-connect/certs
 
