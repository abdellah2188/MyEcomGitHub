spring.application.name=order-serviceb
spring.config.import=optional:consul:
management.endpoints.web.exposure.include=*
server.port=${SERVICE_PORT:0}

management.server.port=9904

# Indispensable si le port management est différent
spring.cloud.consul.discovery.health-check-port=${management.server.port}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.register-health-check-service=false
spring.cloud.consul.discovery.management-register=false


spring.cloud.consul.config.enabled=true
spring.cloud.consul.config.name=order-serviceb
spring.cloud.consul.config.watch.enabled=false
spring.cloud.consul.config.format=properties
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.preferIpAddress=true

spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}

logging.level.com.hamch.orderserviceb.services.CustomerRestClientService=debug
logging.level.com.hamch.orderserviceb.services.InventoryRestClientService=debug
feign.client.config.default.loggerLevel=full


orders.order-events-exchange=orders-exchange
orders.new-orders-queue=new-orders
orders.delivered-orders-queue=delivered-orders
orders.cancelled-orders-queue=cancelled-orders
orders.error-orders-queue=error-orders

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.cloud.loadbalancer.ribbon.enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KC_HOST:localhost}:${KC_PORT:7080}/realms/microservices-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KC_HOST:localhost}:${KC_PORT:7080}/realms/microservices-realm/protocol/openid-connect/certs

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:123}
# Enable caching
spring.cache.type=redis



#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/microservices-realm/protocol/openid-connect/certs
#logging.level.org.springframework.security=DEBUG
#

spring.security.strategy=mode_inheritable_thread_local
spring.cloud.stream.source=orderNotification
spring.cloud.stream.bindings.orderNotification-out-0.destination=order-notification-exchange
spring.cloud.stream.rabbit.bindings.orderNotification-out-0.producer.exchangeType=topic

spring.cloud.stream.rabbit.bindings.orderNotification-out-0.producer.routing-key=my.routing.key

#
spring.sleuth.circuitbreaker.enabled=false
spring.sleuth.integration.enabled=true
spring.zipkin.base-url=http://localhost:9411/
spring.sleuth.sampler.probability=1