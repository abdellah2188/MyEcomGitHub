             - RABBITMQ_HOST=rabbitmq
             - RABBITMQ_PW=5672
           healthcheck:
             test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
             interval: 10s
             retries: 4
           networks:
             - net-micros
           depends_on:
              config-service:
                condition: service_healthy
       

    