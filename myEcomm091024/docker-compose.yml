  product-serviceb:
        build: ./product-serviceb
        container_name: cn-product-service
        command: sh -c '/bin/wait-for-it.sh rabbitmq:5672 --timeout=30 -- node consumer.js'
        environment:
          - JAVA_TOOL_OPTIONS=
          - CONSUL_HOST=discovery
          - CONSUL_PORT=8500
          - CONFIG_SERVICE_URL=config-service
          - CONFIG_SERVICE_PORT=8889
          - DOCKER_MYSQL=mysql-db
          - MYSQL_PW=root
          - MYSQL_USR=root
          #- SPRING_PROFILES_ACTIVE=docker  
          - SPRING_DATA_SOURCE_URL=jdbc:mysql://mysql-db:3306/product-service?createDatabaseIfNotExist=true
          - RABBITMQ_HOST=rabbitmq
          - RABBITMQ_PW=5672
        healthcheck:
          test: [ "CMD", "curl", "-f", "http://localhost:$${server.port}/actuator/health" ]
          interval: 10s
          retries: 4
        networks:
          - net-micros
        depends_on:
           api-gateway-service:
             condition: service_healthy
   
