volumes:
   CONSUL_DATAD:
   MYSQL_DATA:
   MYSQL_KEYC:
   MYSQL_DATAK:

networks:
   net-micros:
      driver: bridge  

#version: '3.9'
services:
  front-angular:
    build: ./ng-keycloak-master
    container_name: cn-front-angular
    ports:
      - '4200:80'
    expose:
      - '4200'
    links:
      - product-serviceb
    networks:
      - net-micros

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: cn-keycloak
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 7080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
      PROXY_ADDRESS_FORWARDING: 'true'
     # KC_HTTP_RELATIVE_PATH: /auth
      DB_VENDOR: MYSQL
      DB_ADDR: mysql
      DB_USER: user
      DB_PASSWORD: user
      DB_PORT: "3308"
      DB_DATABASE: keycloak
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7080/health/ready"]
      interval: 15s
      timeout: 2s
      retries: 15
  #  command: ["start-dev", "--http-port", "7080", "--https-port", "7443", "--import-realm"]
    volumes: # Ignore if you don't have realm-export.json to migrate data
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
      #- D:/Java091024/MYSQL_KEYC:/tmp/backups/  
    command:
        - "-start-dev" 
        - "-http-port=7080", 
        - "-https-port=7443"
        - "-import-realm"
        - "-Dkeycloak.migration.action=export"
        - "-Dkeycloak.migration.provider=singleFile"
        - "-Dkeycloak.migration.realmName=microservices-realm"
        - "-Dkeycloak.migration.usersExportStrategy=REALM_FILE"
        - "-Dkeycloak.migration.file=/tmp/export/keep-growing-realm.json"  
    ports:
      - "7080:7080"
      - "7443:7443"
    depends_on:
      - mysql-dbk  
    networks:
      - net-micros

  mysql-dbk:
    image: mysql
    container_name: cn-mysqlk
    environment:
      - MYSQL_ROOT_PASSWORD=root
  # The user, password and database that Keycloak
      # is going to create and use
      - MYSQL_USER=user
      - MYSQL_PASSWORD=user
      - MYSQL_DATABASE=keycloak  
    ports:
      - 3308:3306
    healthcheck:
        test: [ "CMD", "curl", "-f", "http://localhost:3306/health" ]
        interval: 10s
        retries: 10
    restart: always
    networks:
      - net-micros
    #volumes:
      #- D:/Java091024/MYSQL_DATAK:/var/lib/mysql
      #- B:/Java091024/MYSQL_CONF:/etc/mysql
  mysql-db:
      image: mysql
      container_name: cn-mysql
      environment:
        - MYSQL_ROOT_PASSWORD=root
    # The user, password and database that Keycloak
        # is going to create and use
        #- MYSQL_USER=user
        #- MYSQL_PASSWORD=user
        #- MYSQL_DATABASE=keycloak  
      ports:
        - 3307:3306
      healthcheck:
          test: [ "CMD", "curl", "-f", "http://localhost:3306/health" ]
          interval: 10s
          retries: 10
      restart: always
      networks:
        - net-micros
      volumes:
        - D:/Java091024/MYSQL_DATA:/var/lib/mysql
        #- B:/Java091024/MYSQL_CONF:/etc/mysql
  phpMyAdmin:
      image: phpmyadmin/phpmyadmin
      restart: always
      container_name: phpMyAdmin
      environment:
        - PMA_ARBITRARY=1
      links:
        - mysql-db
      ports:
        - "7089:80"
      networks:
        - net-micros

  phpMyAdmink:
      image: phpmyadmin/phpmyadmin
      restart: always
      container_name: phpMyAdmink
      environment:
        - PMA_ARBITRARY=1
      links:
        - mysql-dbk
      ports:
        - "7090:80"
      networks:
        - net-micros  

  discovery:
    image: hashicorp/consul:latest
    container_name: discovery
    environment:
        - CONUL_BIND_INTERFACE=eth0
    volumes:
        - D:\Java091024\CONSUL_DATAD:/consul/data
    ports:
       - '8501:8500'
    healthcheck:
        test: [ "CMD", "curl", "-f", "http://localhost:8500/health" ]
        interval: 10s
        retries: 10
    restart: always
    #depends_on:
       #- mysql-db
           #condition: service_started
    networks:
          - net-micros
      
  config-service:
     build: ./config-service
     container_name: config-service
     #image: im-config-service
     command: sh -c '/bin/wait-for-it.sh rabbitmq:5672 --timeout=30 -- node consumer.js'
     ports:
        - "8889:8889"
     environment:
        - CONSUL_HOST=discovery
        - CONSUL_PORT=8500
        - CONFIG_PORT=8889
        - RABBITMQ_HOST=rabbitmq
        - RABBITMQ_PW=5672

     healthcheck:
        test: [ "CMD", "curl", "-f", "http://localhost:8889/actuator/health" ]
        interval: 10s
        retries: 10
     depends_on:
         - discovery
        # - rabbitmq
            #condition: service_healthy
     networks:
       - net-micros     
  rabbitmq:
    image: rabbitmq:management
    restart: always
    container_name: cn-rabbitmq
    environment:
       RABBITMQ_DEFAULT_USER: guest
       RABBITMQ_DEFAULT_PASS: guest
       RABBITMQ_DEFAULT_VHOST: /
    ports:
      - 5673:5672
      - 15673:15672
    networks:
      - net-micros
